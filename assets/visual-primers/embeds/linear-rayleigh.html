</head><body><main class="visual-primer" data-primer="linear"><p>Here M has rows (2, 1) and (1, 2). The input v keeps length one, so its Rayleigh quotient is R(v) = v · Mv.</p><figure class="figure" id="mixture-figure"><div class="art art-responsive" tabindex="0" role="group" aria-label="Illustration; panels stack on small screens"><div class="art-desktop"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 906" data-unit-experiment="true" role="img" aria-labelledby="fig07-title fig07-desc">
<title id="fig07-title">Turn a unit input and watch R(v) change</title><desc id="fig07-desc">Ordinary coordinates show a teal unit input v, its orange output Mv, the blue output component R(v)v along the input, and a dashed perpendicular remainder. The dashed circle is the set of all unit inputs. Initially v=(3,1)/sqrt(10), so its Rayleigh quotient is 2.6. A closer view of the same unit input shows its two perpendicular eigenvector components. Their signed coefficients are about 0.447 and 0.894, and their shares of squared length are 20 percent and 80 percent. Turning the input changes its quotient between 1 and 3. A chart at the bottom plots the quotient of every direction from -180 to 180 degrees, a wave between 1 and 3 that touches 3 at 45 and -135 degrees (the u2 line) and 1 at -45 and 135 degrees (the u1 line); a dot on the curve marks the current input.</desc>

<title id="fig07m-title">Turn a unit input and watch R(v) change</title><desc id="fig07m-desc">Ordinary coordinates show a teal unit input v, its orange output Mv, the blue output component R(v)v along the input, and a dashed perpendicular remainder. The dashed circle is the set of all unit inputs. Initially v=(3,1)/sqrt(10), so its Rayleigh quotient is 2.6. A closer view of the same unit input shows its two perpendicular eigenvector components. Their signed coefficients are about 0.447 and 0.894, and their shares of squared length are 20 percent and 80 percent. Turning the input changes its quotient between 1 and 3. A chart at the bottom plots the quotient of every direction from -180 to 180 degrees, a wave between 1 and 3 that touches 3 at 45 and -135 degrees (the u2 line) and 1 at -45 and 135 degrees (the u1 line); a dot on the curve marks the current input.</desc>
