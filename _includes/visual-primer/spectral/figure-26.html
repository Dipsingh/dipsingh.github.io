<title id="fig30-title">Three thresholds, three candidate cuts</title><desc id="fig30-desc">Three rows, one per threshold. In each, the eight nodes sit on a number line at their Fiedler values, 0.425 for nodes 1 and 2, 0.263 for 3 and 4, minus 0.263 for 5 and 6, minus 0.425 for 7 and 8, with a dashed threshold in one of the three gaps; the nodes left of it form the group S, shown filled on a copy of the graph with the crossing edges in orange. After the first pair: S is 7, 8; crossing edges 5–7, 5–8, 6–7, 6–8; smaller side min of 2 and 6, which is 2; score 4 over 2 equals 2. After the second pair: S is 5, 6, 7, 8; crossing edges 3–5 and 4–6; smaller side 4; score 2 over 4 equals 0.5. After the third pair: S is 3, 4, 5, 6, 7, 8; crossing edges 1–3, 1–4, 2–3, 2–4; smaller side min of 6 and 2, which is 2; score 4 over 2 equals 2.</desc>
