<figure class="figure"><div class="art art-responsive" tabindex="0" role="group" aria-label="Illustration; panels stack on small screens"><div class="art-desktop"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="15-cheeger-connection-title 15-cheeger-connection-desc"><title id="15-cheeger-connection-title">Cuts and node values suggest each other</title><desc id="15-cheeger-connection-desc">Two conceptual steps use the same eight-node graph. First, assign plus one to vertices 1 through 4 and minus one to vertices 5 through 8. All edges within a side have zero value difference. Only boundary edges 3–5 and 4–6 contribute energy, four each, giving total energy eight. The squared spread is also eight. Dividing every node value by the square root of eight gives squared spread one and energy one. Second, inspect two edges using the unit Fiedler vector’s values. Edge 3–5 spans approximately minus 0.263 to plus 0.263. Edge 1–3 spans plus 0.263 to plus 0.425. A threshold at zero separates the endpoints of edge 3–5, but not those of edge 1–3. Both rows use the same value scale. An edge crosses a threshold cut only when the threshold is between its endpoint values. This illustrates the sweep mechanism; the full Cheeger guarantee also accounts for the sizes of the resulting sides.</desc><rect width="760" height="620" fill="white"/>
<text x="22" y="32" font-family="'Humor Sans','Comic Sans MS','Chalkboard SE',cursive" font-size="23" fill="#1f1f1f" text-anchor="start" word-spacing="-0.18em">Cuts and values</text>
<text x="22" y="61" font-family="'Playpen Sans','Chalkboard SE','Comic Sans MS',cursive" font-size="17.1" fill="#5c6670" text-anchor="start">Each helps us find the other.</text>
<g transform="translate(22 108)">

</svg></div><div class="art-mobile"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 1075" role="img" aria-labelledby="15-cheeger-connection-mobile-title 15-cheeger-connection-mobile-desc"><title id="15-cheeger-connection-mobile-title">Cuts and node values suggest each other</title><desc id="15-cheeger-connection-mobile-desc">Two conceptual steps use the same eight-node graph. First, assign plus one to vertices 1 through 4 and minus one to vertices 5 through 8. All edges within a side have zero value difference. Only boundary edges 3–5 and 4–6 contribute energy, four each, giving total energy eight. The squared spread is also eight. Dividing every node value by the square root of eight gives squared spread one and energy one. Second, inspect two edges using the unit Fiedler vector’s values. Edge 3–5 spans approximately minus 0.263 to plus 0.263. Edge 1–3 spans plus 0.263 to plus 0.425. A threshold at zero separates the endpoints of edge 3–5, but not those of edge 1–3. Both rows use the same value scale. An edge crosses a threshold cut only when the threshold is between its endpoint values. This illustrates the sweep mechanism; the full Cheeger guarantee also accounts for the sizes of the resulting sides.</desc><rect width="380" height="1075" fill="white"/>
