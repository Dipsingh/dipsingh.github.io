<figure class="figure adjacency-gap">
<div class="art art-responsive" role="group" aria-label="Equal spectral gaps for A and L in our original graph">
<div class="art-desktop"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" role="img" aria-labelledby="adjacency-gap-desktop-title adjacency-gap-desktop-desc">
<title id="adjacency-gap-desktop-title">The same gap from adjacency and Laplacian eigenvalues</title>
<desc id="adjacency-gap-desktop-desc">For our original graph, the two largest adjacency eigenvalues are the square root of five, approximately 2.236, and 3. The two smallest Laplacian eigenvalues are 0 and 3 minus the square root of five, approximately 0.764. The difference in each pair is exactly the same: lambda two equals 3 minus the square root of five. The equal-length segments show these equal gaps; the displayed decimals are rounded.</desc>
<g transform="translate(0 0)" font-family="'Playpen Sans','Chalkboard SE','Comic Sans MS',cursive" text-anchor="middle">
<text x="180" y="32" font-size="20" font-weight="700" fill="#1f1f1f">A: two largest eigenvalues</text>
<text x="180" y="88" font-size="18" fill="#245e9b">3 − 2.236 ≈ 0.764</text>
<line x1="75" y1="114" x2="285" y2="114" stroke="#245e9b" stroke-width="3" data-gap-line="true"/>
<circle cx="75" cy="114" r="7" fill="#245e9b"/>
<circle cx="285" cy="114" r="7" fill="#245e9b"/>
<text x="75" y="153" font-size="22" font-weight="700" fill="#245e9b">2.236</text>
<text x="285" y="153" font-size="22" font-weight="700" fill="#245e9b">3</text>
</g>
<g transform="translate(400 0)" font-family="'Playpen Sans','Chalkboard SE','Comic Sans MS',cursive" text-anchor="middle">
<text x="180" y="32" font-size="20" font-weight="700" fill="#1f1f1f">L: two smallest eigenvalues</text>
<text x="180" y="88" font-size="18" fill="#177d75">0.764 − 0 ≈ 0.764</text>
<line x1="75" y1="114" x2="285" y2="114" stroke="#177d75" stroke-width="3" data-gap-line="true"/>
<circle cx="75" cy="114" r="7" fill="#177d75"/>
<circle cx="285" cy="114" r="7" fill="#177d75"/>
<text x="75" y="153" font-size="22" font-weight="700" fill="#177d75">0</text>
<text x="285" y="153" font-size="22" font-weight="700" fill="#177d75">0.764</text>
</g>
</svg></div>
