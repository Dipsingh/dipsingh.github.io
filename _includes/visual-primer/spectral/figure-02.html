<title id="fig22-title">The route this primer takes</title><desc id="fig22-desc">A hand-drawn map with six stops joined by a dotted trail. Stop one, chapters 1 and 2: read the wiring into the matrices A, D and L. Stop two, chapter 3: name the weakness, the cut score and edge expansion. Stop three, chapters 4 and 5: score a pattern fairly with energy, centering and the Rayleigh quotient. Stop four, chapters 6 and 7: find the best pattern, whose score is the second eigenvalue. Stop five, chapters 8 and 9: turn it back into a cut, with Cheeger&#x27;s guarantee. Stop six, chapters 10 to 12: design for expansion and read the RNG paper.</desc>
