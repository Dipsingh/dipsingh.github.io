<title id="fig25-title">Three reasons to square the gaps</title><desc id="fig25-desc">Three small examples. One: a link between plus one and minus one read left to right gives plus two, read right to left gives minus two, and squaring gives four either way. Two: a node holding 5 between neighbours holding 3 and 7 has signed differences plus two and minus two, which add to zero, while the squares add to eight. Three: one gap of 3 squares to 9, while three gaps of 1 square to 1 plus 1 plus 1, which is 3.</desc>
