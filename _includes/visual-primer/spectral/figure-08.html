<figure class="figure"><div class="art art-responsive" tabindex="0" role="group" aria-label="Illustration; panels stack on small screens"><div class="art-desktop"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 545" role="img" aria-labelledby="18-degree-title 18-degree-desc"><title id="18-degree-title">Degree multiplies each node’s own value</title><desc id="18-degree-desc">The complete eight-by-eight degree matrix D has threes on its diagonal and zeros elsewhere. All eight nodes in this graph have degree three. Row 3 is highlighted, with its only nonzero entry in column 3. For input value x three equal to plus one, row 3 returns three copies of that same value, giving plus three. The node ID 3 remains unchanged. The seven off-diagonal zeros ensure that none of the other nodes’ values enter this output. Row and column labels are node IDs.</desc><rect width="760" height="545" fill="white"/>
