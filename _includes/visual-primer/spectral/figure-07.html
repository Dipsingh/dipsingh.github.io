<figure class="figure"><div class="art art-responsive" tabindex="0" role="group" aria-label="Illustration; panels stack on small screens"><div class="art-desktop"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 545" role="img" aria-labelledby="17-adjacency-title 17-adjacency-desc"><title id="17-adjacency-title">One adjacency row lists one node’s neighbours</title><desc id="17-adjacency-desc">The same eight-node graph appears beside its complete eight-by-eight adjacency matrix A. Node 3 and row 3 are highlighted in teal. Node 3 is joined to nodes 1, 2, and 5. Those three neighbours, their incident edges, and the ones in columns 1, 2, and 5 of row 3 are blue. A one records an edge; a zero records no edge. Every diagonal entry is zero because there are no self-edges. Row and column labels are node IDs, not values assigned to the nodes. The graph and matrix are stacked on phones.</desc><rect width="760" height="545" fill="white"/>
