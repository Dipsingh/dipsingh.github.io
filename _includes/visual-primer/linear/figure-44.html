<title id="c12b-title">Chart: the Rayleigh quotient of every direction</title><desc id="c12b-desc">A hand-drawn chart of the Rayleigh quotient of M for every direction from 0 to 180 degrees. The curve is 2 plus sine of twice the angle. It touches its ceiling of 3, the eigenvalue lambda-2, at 45 degrees, the direction of q2, and its floor of 1, the eigenvalue lambda-1, at 135 degrees, the direction of minus q1, on the q1 line. The ordinary axis directions at 0 and 90 degrees both score 2, matching the diagonal entries of M. The direction of x = (3, 1), at about 18 degrees, scores 2.6.</desc>
