<title id="06-energy-title">The matrix scales the two eigenvector coordinates separately</title><desc id="06-energy-desc">The orthonormal eigenvectors u1 and u2 form perpendicular coordinate axes. The input x has coordinates square root two and twice square root two. Applying M preserves the first coordinate and triples the second. Their squared lengths are 2 and 8. Multiplying by the eigenvalues 1 and 3 gives quadratic-form contributions 2 and 24. The squared norm is 10 and the quadratic form is 26.</desc>

<text x="28" y="73" font-family="'Playpen Sans','Chalkboard SE','Comic Sans MS',cursive" font-size="18.1" fill="#58636c" text-anchor="start">These axes follow the unit eigenvectors u<tspan font-size="12.3" dy="4.3">1</tspan><tspan dy="-4.3">&#8203;</tspan> and u<tspan font-size="12.3" dy="4.3">2</tspan><tspan dy="-4.3">&#8203;</tspan>.</text>
