<title id="fig27-title">The score as a two-by-two table of dot products</title><desc id="fig27-desc">Two panels, each a two-by-two table whose rows are the input pieces of x = (3, 1) and whose columns are the output pieces. Each cell is one dot product and all four cells add to Q(x) = 26. Left, the ordinary split x = a + b with a = (3, 0) and b = (0, 1): the diagonal cells a dot Ma = 18 and b dot Mb = 2 are the piece scores, and the off-diagonal cross terms a dot Mb and b dot Ma are 3 each, the missing six. Right, the eigenvector split x = a + b with a = (1, -1) and b = (2, 2): the diagonal cells are 2 and 24, and both cross terms are 0.</desc>
