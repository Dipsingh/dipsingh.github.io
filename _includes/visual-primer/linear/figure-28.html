<title id="14-rayleigh-projection-title">Compare the along-input output for three unit inputs</title><desc id="14-rayleigh-projection-desc">Three ordinary-coordinate plots have the same coordinate scale and inputs of length one. The teal arrow is the input, orange its output, and blue the output component along the input line. The gray dashed arrow runs from that component’s tip to the output’s tip. Along u1 the score is 1 and the output equals the input. Along x-hat=(3,1)/sqrt(10), the score is 2.6, and the output has a nonzero perpendicular remainder. Along u2 the score is 3 and the output is three times the input. In both eigenvector directions, the output and its along-input component coincide.</desc>
