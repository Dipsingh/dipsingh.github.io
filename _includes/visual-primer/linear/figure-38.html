<figure class="comic" id="c09c-scores"><div class="art comic-art wide-chart" style="max-width:760px" title="N&#x27;s curve is cos² of the angle. It touches zero at 90°, the vertical direction, and never goes below it. M&#x27;s curve never dips under 1: every direction gets a positive score." tabindex="0" role="group" aria-label="Every direction&#x27;s score, for M and for N (chart)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 486" role="img" aria-labelledby="c09c-title c09c-desc">
<title id="c09c-title">Chart: the unit-input score of every direction, for M and for N</title><desc id="c09c-desc">A hand-drawn chart with two computed curves over directions from 0 to 180 degrees. The teal curve is M&#x27;s unit-input score, 2 plus sine of twice the angle: it stays between 1 and 3, touching its floor of 1 at 135 degrees, on the q1 line. The red curve is N&#x27;s unit-input score, cosine squared: it equals 1 at 0 and 180 degrees and drops to exactly zero at 90 degrees, the vertical direction that N ignores. A dashed blue line marks M&#x27;s floor at 1.</desc>
