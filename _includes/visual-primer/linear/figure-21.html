<figure class="figure"><div class="art art-responsive" tabindex="0" role="group" aria-label="Illustration; panels stack on small screens"><div class="art-desktop"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="fig22-title fig22-desc">
<title id="fig22-title">What makes two arrows a coordinate system</title><desc id="fig22-desc">Two panels in ordinary coordinates. Left: the references e1 = (1, 0) and 2e1 = (2, 0) both lie on the horizontal axis. Every combination of them stays on that line, shown as a shaded band with dots at the reachable points. The target x = (3, 1), above the line, is marked as out of reach, and the point (2, 0) is noted as having two descriptions: 2 copies of e1 or 1 copy of 2e1. Right: q1 = (1, -1) and q2 = (1, 1) point in different directions. A faint grid of lines parallel to each shows that their combinations cover the plane, and x = (3, 1) is reached by one copy of q1 followed by two copies of q2.</desc>
<rect width="760" height="470" fill="#fff"/>
<text x="24" y="36" font-family="'Humor Sans','Comic Sans MS','Chalkboard SE',cursive" font-size="22" fill="#1f1f1f" text-anchor="start" word-spacing="-0.18em">Enough directions, and only one recipe per point</text>

<text x="12" y="46" font-family="'Playpen Sans','Chalkboard SE','Comic Sans MS',cursive" font-size="15.5" fill="#5c6670" text-anchor="start">“East” and “more east.”</text>
