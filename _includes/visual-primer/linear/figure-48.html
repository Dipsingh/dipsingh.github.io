<title id="15-mean-plane-title">Removing the common component leaves a plane; unit length selects a circle</title><desc id="15-mean-plane-desc">The first panel is an orthographic view of three-dimensional vector space. The vector z=(3,1,2) splits into p=(2,2,2), its projection on the all-equal direction h=(1,1,1), and r=(1,-1,0). The remainder r is perpendicular to h and lies in the plane of vectors whose entries sum to zero. The remainder is shown both from p to z and translated to the origin. In the second panel, the view turns to face that plane. Its unnamed coordinate axes are the orthonormal directions (1,-1,0)/sqrt(2) and (1,1,-2)/sqrt(6). The circle consists of all vectors in that plane with length one. Dividing r by sqrt(2) places it on the circle.</desc>
