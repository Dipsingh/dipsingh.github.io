<title id="fig32-title">What the spectral theorem says about M</title><desc id="fig32-desc">Two panels in ordinary coordinates. Left: the dashed unit circle of all length-one inputs and, in teal, the ellipse their outputs land on after applying M. The ellipse&#x27;s axes lie along the two eigenlines: it reaches 1 along u1, where M multiplies by 1, and 3 along u2, where M multiplies by 3. The unit input x-hat and its output M x-hat on the ellipse are drawn as a sample. Right: the recipe for x = (3, 1). Dashed drops give its shadows on the eigenlines, (1, -1) and (2, 2). The first is multiplied by 1 and stays put; the second is multiplied by 3 to give (6, 6). Added tip to tail, 1 times (1, -1) plus 3 times (2, 2) equals (7, 5), which is M x.</desc>
