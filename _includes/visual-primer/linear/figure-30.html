<title id="fig25-title">Why the unit input x-hat scores 2.6</title><desc id="fig25-desc">Left: ordinary coordinates with the dashed unit circle. The unit input x-hat is split into a blue piece 0.447 u1 and an orange piece 0.894 u2, drawn tip to tail. Their outputs, drawn faintly, are the blue piece unchanged (multiplier 1) and the orange piece tripled to 2.683 u2 (multiplier 3); tip to tail they reach the output M x-hat = (7, 5) divided by root 10. Right: a ledger. The u1 piece contributes input amount 0.447 times output amount 1 times 0.447, which is 0.2. The u2 piece contributes 0.894 times 3 times 0.894, which is 2.4. The total score is 2.6, the same as 1 times the 20 percent share plus 3 times the 80 percent share.</desc>
