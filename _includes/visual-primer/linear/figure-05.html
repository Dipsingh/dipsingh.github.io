<title id="c02-machine-title">Comic: the arrow machine</title><desc id="c02-machine-desc">A box labeled M has an IN funnel on top and an OUT chute on the side. Panel 1: B drops the arrow (3, 1) into the funnel and says: I put in (3, 1)... A, catching what comes out of the chute, says: ...and out comes (7, 5). Panel 2: B asks: What if I put in two arrows, tip to tail? A says: Same as putting them in one at a time and adding what comes out. Panel 3: B asks: What if I put in nothing? A says: You get nothing. It&#x27;s a very fair machine.</desc>

<title id="c02-machine-m-title">Comic: the arrow machine</title><desc id="c02-machine-m-desc">A box labeled M has an IN funnel on top and an OUT chute on the side. Panel 1: B drops the arrow (3, 1) into the funnel and says: I put in (3, 1)... A, catching what comes out of the chute, says: ...and out comes (7, 5). Panel 2: B asks: What if I put in two arrows, tip to tail? A says: Same as putting them in one at a time and adding what comes out. Panel 3: B asks: What if I put in nothing? A says: You get nothing. It&#x27;s a very fair machine.</desc>
