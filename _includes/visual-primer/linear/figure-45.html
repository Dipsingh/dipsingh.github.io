<figure class="comic" id="c12c-lose"><div class="art comic-art wide-chart" style="max-width:760px" title="A&#x27;s eigenvectors still score exactly their eigenvalues, 1 and 2. They just aren&#x27;t the ends of the range: the real extremes, 0.79 and 2.21, belong to directions that A turns. With slanted pieces the score isn&#x27;t a blend of the eigenvalues, so the eigenvalues fence nothing in." tabindex="0" role="group" aria-label="The same chart for A, whose eigenlines are 45° apart (chart)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 486" role="img" aria-labelledby="c12c-title c12c-desc">
<title id="c12c-title">Chart: the unit-input score of every direction for A, a matrix with slanted eigenlines</title><desc id="c12c-desc">A hand-drawn chart of the unit-input score of A, with rows (1, 1) and (0, 2), for every direction from 0 to 180 degrees. Dashed lines mark A&#x27;s eigenvalues 1 and 2. The curve passes through 1 at 0 degrees, the eigenvector (1, 0), and through 2 at 45 degrees, the eigenvector (1, 1), but it is not fenced in by them: it rises to 2.21 at 67.5 degrees and falls to 0.79 at 157.5 degrees, directions that are not eigenvectors of A.</desc>
