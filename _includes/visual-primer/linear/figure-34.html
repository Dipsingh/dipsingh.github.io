<title id="11-cross-terms-title">Perpendicular components need not have additive quadratic scores</title><desc id="11-cross-terms-desc">Both panels use x=(3,1) and M with rows (2,1) and (1,2), on identical coordinate scales. In the ordinary-coordinate split, a=(3,0) and b=(0,1) are perpendicular, but Mb=(1,2) turns toward a. The separate scores are 18 and 2; cross terms of 3 each bring their sum to 26. In the eigenvector split, a=(1,-1) and b=(2,2) are perpendicular. Mb=(6,6) stays on the line of b and remains perpendicular to a. The separate scores are 2 and 24, and both cross terms are zero.</desc>

<title id="11-cross-terms-mobile-title">Perpendicular components need not have additive quadratic scores</title><desc id="11-cross-terms-mobile-desc">Both panels use x=(3,1) and M with rows (2,1) and (1,2), on identical coordinate scales. In the ordinary-coordinate split, a=(3,0) and b=(0,1) are perpendicular, but Mb=(1,2) turns toward a. The separate scores are 18 and 2; cross terms of 3 each bring their sum to 26. In the eigenvector split, a=(1,-1) and b=(2,2) are perpendicular. Mb=(6,6) stays on the line of b and remains perpendicular to a. The separate scores are 2 and 24, and both cross terms are zero.</desc>
