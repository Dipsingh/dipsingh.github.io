<figure class="figure" id="eigen-transformation"><div class="art" tabindex="0" role="group" aria-label="Illustration; scroll horizontally on small screens"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" id="tf-plane" data-origin-x="190" data-origin-y="410" data-scale="47" aria-labelledby="fig04-title fig04-desc">
<title id="fig04-title">Apply the same matrix to three arrows</title><desc id="fig04-desc">The final state of the matrix transformation with rows (2,1) and (1,2), drawn by hand. The grid has been stretched along the upward diagonal. The teal vector x=(3,1) changes to Mx=(7,5), changing its direction. The blue vector q1=(1,-1) is unchanged. The orange vector q2=(1,1) becomes (3,3), three times its original length on the same line. Dashed arrows mark the starting positions of x and q2. The ordinary coordinate axes stay fixed, with equal scales. The animation moves from each input to its output under one application of M.</desc>
<rect width="760" height="600" fill="#fff"/>
<text x="28" y="36" font-family="'Humor Sans','Comic Sans MS','Chalkboard SE',cursive" font-size="22" fill="#1f1f1f" text-anchor="start" word-spacing="-0.18em">Almost everybody moves. Two directions stay on their lines.</text>
<text x="28" y="70" font-family="'Playpen Sans','Chalkboard SE','Comic Sans MS',cursive" font-size="18" fill="#5c6670" text-anchor="start">The teal arrow turns. Blue and orange stay on their dashed lines.</text>
