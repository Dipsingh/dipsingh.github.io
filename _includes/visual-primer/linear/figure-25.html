</svg></div></div><figcaption><strong>Not every matrix gives perpendicular eigenlines.</strong> Left: M's unit arrows u₁ and u₂ lie on eigenlines that meet at 90°. Right: the matrix A with rows (1, 1) and (0, 2) has eigenlines through (1, 0) and (1, 1), only 45° apart. Rotation by 90° is worse still: it knocks every arrow off its line, so it has no real eigenvectors at all.<sup class="fnref"><a href="#fn-14" id="fnref-14" data-fn="14" aria-expanded="false" aria-label="Footnote 14">[14]</a></sup></figcaption></figure>
