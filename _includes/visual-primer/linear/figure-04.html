<title id="fig20-title">Adding two arrows tip to tail</title><desc id="fig20-desc">Ordinary coordinates. The blue arrow (1, -1) starts at the origin. The orange arrow (2, 2) starts at the blue arrow&#x27;s tip and ends at (3, 1). The teal arrow x = (3, 1) runs from the origin straight to that endpoint. A faint copy of the two arrows in the other order, (2, 2) first and then (1, -1), reaches the same point. To the right, the sum is written out entry by entry: 1 + 2 = 3 and -1 + 2 = 1.</desc>
