<figure class="comic" id="c06b-turning"><div class="art comic-art wide-chart" style="max-width:760px" title="Directions 180° apart get turned by exactly the same amount, because M(−x) = −Mx. That&#x27;s why the chart can stop at 180°." tabindex="0" role="group" aria-label="Every starting direction, computed from M (chart)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 486" role="img" aria-labelledby="c06b-title c06b-desc">
<title id="c06b-title">Chart: how far M turns an arrow, by direction</title><desc id="c06b-desc">A hand-drawn chart. The horizontal axis is the direction an arrow starts in, from 0 to 180 degrees measured from the x1-axis. The vertical axis is how many degrees M turns it, counterclockwise positive. The curve starts at about 27 degrees at 0, falls to zero at 45 degrees (the direction of q2, which is only stretched by 3), reaches minus 30 degrees at 105, returns to zero at 135 degrees (the direction of minus q1, on the q1 line, which M leaves unchanged), and climbs to plus 30 degrees at 165. The point for x = (3, 1), at about 18 degrees, shows a turn of about 17 degrees. Dashed lines at plus and minus 30 degrees mark the largest turn of any direction. Every other direction is turned toward the q2 line.</desc>
