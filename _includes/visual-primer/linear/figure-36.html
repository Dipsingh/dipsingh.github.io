<title id="18-zero-direction-title">A nonzero input can have zero output and zero score</title><desc id="18-zero-direction-desc">This is a separate hypothetical transformation N, not the running matrix M. N sends (a,b) to (a,0). The nonzero vertical vector v=(0,1) is sent to the zero vector at the origin. Thus v is an eigenvector with eigenvalue zero and its quadratic score is zero. N is positive semidefinite, since the score of any input (a,b) is a squared.</desc>

<text x="28" y="71" font-family="'Playpen Sans','Chalkboard SE','Comic Sans MS',cursive" font-size="18.1" fill="#58636c" text-anchor="start">Separate example: N sends (a, b) to (a, 0).</text>

</svg></div><figcaption><strong>A length-one input scores zero.</strong> N sends the vertical arrow v to the origin, so v has eigenvalue zero. We got a zero score by picking a direction N ignores, not by shrinking the input. (N is a separate example, not M.)</figcaption></figure>
