<title id="17-unit-eigenbasis-title">Change the reference steps while keeping the whole input fixed</title><desc id="17-unit-eigenbasis-desc">Two complete decompositions use ordinary coordinates and the same scale. In each, the teal input x=(3,1), blue component (1,-1), and orange component (2,2) have the same endpoints. Ticks on the components mark equal reference steps. With the original references q1 and q2, a step has length square root two; the coefficients are 1 and 2. With unit references u1 and u2, a step has length one; the coefficients become square root two and twice square root two. Only the measuring steps and coefficients change. The input and its two components stay fixed.</desc>
