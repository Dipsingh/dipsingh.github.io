<title id="03-baseline-title">Change the description first, then apply the matrix</title><desc id="03-baseline-desc">Three stages use ordinary coordinate axes and the same scale. First, the input x=(3,1) is shown as the horizontal component (3,0) plus the vertical component (0,1). Second, exactly the same input is shown as q1=(1,-1) plus 2q2=(2,2), with eigenvector coordinates (1,2). Third, M keeps the q1 component and triples the q2 component, giving Mx=q1+6q2=(7,5), with eigenvector coordinates (1,6). A faint copy of the original x remains in the last stage. Changing coordinates leaves x unchanged; applying M changes it.</desc>
