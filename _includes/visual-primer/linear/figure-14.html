<title id="10-projection-title">Find the closest point on the diagonal</title><desc id="10-projection-desc">In ordinary coordinates, the diagonal through the origin has direction d=(1,1). The closest point to the tip of x=(3,1) is (2,2). The teal projection p runs from the origin to that point. The orange remainder r runs from the tip of p to the tip of x and meets the diagonal at a right angle. It moves one step right and one step down, so r=(1,-1), even though it starts at (2,2). A faint alternate point at (1,1) has a longer connection to x. Following p then r reaches the same point as x.</desc>
