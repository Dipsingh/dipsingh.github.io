<title id="c09b-blindspot-title">Comic: N&#x27;s blind spot</title><desc id="c09b-blindspot-desc">N, a character whose head is the matrix with rows 1 0 and 0 0, sits behind a desk handing out scores. Panel 1: B, in a beanie, points at a vertical arrow labeled v = (0, 1). N says: Score: zero. B says: Zero? I&#x27;m a whole arrow! Panel 2: The vertical arrow is now twice as tall, labeled (0, 2). B asks: Okay, how about now? N says: Still zero. Vertical is not my department. Panel 3: Away from the desk, B asks A: So am I... nothing? A says: Nope. A zero from N means &quot;nothing N counts,&quot; not &quot;nothing there.&quot;</desc>
