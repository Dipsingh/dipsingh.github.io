<title id="fig33-title">The search, run inside the mean plane</title><desc id="fig33-desc">Two panels. Left: three centred lists drawn as bars. The ramp 1, 0, -1 has bumpiness 2 and squared length 2, quotient 1. Our centred list 1, -1, 0 has bumpiness 5 and squared length 2, quotient 2.5. The zigzag 1, -2, 1 has bumpiness 18 and squared length 6, quotient 3. Right: a chart of the quotient for every point on the circle of centred unit lists, by angle from the ramp. It is a wave from 1 at the ramp (0 and 180 degrees) up to 3 at the zigzag (90 degrees), with our list at 60 degrees scoring 2.5. Dashed lines mark 1 and 3; a red dotted line at 0 marks the flat list, which is not on the circle.</desc>
