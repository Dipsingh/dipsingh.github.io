<figure class="figure"><div class="art art-responsive" tabindex="0" role="group" aria-label="Illustration; panels stack on small screens"><div class="art-desktop"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 616" role="img" aria-labelledby="fig30-title fig30-desc">
<title id="fig30-title">Why the score curve is a wave</title><desc id="fig30-desc">Three parts. First, the unit circle with the eigenlines of u1 and u2 drawn through it and the unit input x-hat at about 18 degrees. Its shadow on the u2 line has length 0.894 and its shadow on the u1 line has length 0.447; the angle between x-hat and u2 is about 26.6 degrees, and 0.894 is the cosine of that angle. The shares are the squares, 0.8 and 0.2, which add to 1. Second, a chart of the share along u2 for every direction from 0 to 180 degrees: a cosine-squared wave that equals 1 at 45 degrees, the direction of u2, and 0 at 135 degrees, on the u1 line; the share along u1 is the mirror-image wave. Third, a chart of the score, 1 times the u1 share plus 3 times the u2 share: the same wave stretched to run from 1 to 3, with x-hat at 2.6.</desc>
<rect width="760" height="616" fill="#fff"/>
<text x="24" y="36" font-family="'Humor Sans','Comic Sans MS','Chalkboard SE',cursive" font-size="22" fill="#1f1f1f" text-anchor="start" word-spacing="-0.18em">Why the score curve is a wave</text>
<text x="24" y="64" font-family="'Playpen Sans','Chalkboard SE','Comic Sans MS',cursive" font-size="16.5" fill="#5c6670" text-anchor="start">A share is a shadow squared, and the score blends the eigenvalues with the shares</text>

<title id="fig30m-title">Why the score curve is a wave</title><desc id="fig30m-desc">Three parts. First, the unit circle with the eigenlines of u1 and u2 drawn through it and the unit input x-hat at about 18 degrees. Its shadow on the u2 line has length 0.894 and its shadow on the u1 line has length 0.447; the angle between x-hat and u2 is about 26.6 degrees, and 0.894 is the cosine of that angle. The shares are the squares, 0.8 and 0.2, which add to 1. Second, a chart of the share along u2 for every direction from 0 to 180 degrees: a cosine-squared wave that equals 1 at 45 degrees, the direction of u2, and 0 at 135 degrees, on the u1 line; the share along u1 is the mirror-image wave. Third, a chart of the score, 1 times the u1 share plus 3 times the u2 share: the same wave stretched to run from 1 to 3, with x-hat at 2.6.</desc>
